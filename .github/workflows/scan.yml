name: Gap Scan

on:
  schedule:
    # GitHub cron is UTC only. Two entries straddle US DST; scan.py checks the
    # actual ET hour and exits 0 on the wrong one, so exactly one runs per day.
    - cron: "5 14 * * 1-5"   # 10:05 ET during EDT (Mar-Nov)
    - cron: "5 15 * * 1-5"   # 10:05 ET during EST (Nov-Mar)
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the ET hour / weekday guard"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gap-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name  "gap-scanner[bot]"
          git config user.email "gap-scanner@users.noreply.github.com"
          git add data/ universe.json
          if git diff --staged --quiet; then
            echo "No changes to commit (guard exit or identical output)."
          else
            git commit -m "scan: $(date -u +%Y-%m-%d)"
            git push
          fi
