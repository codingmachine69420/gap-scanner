name: Gap Scan

on:
  schedule:
    # GitHub creates scheduled runs 3.5-9.5 hours after their cron time
    # (measured 8/27-9/21, see CHANGELOG), so no cron can be placed to land
    # just before the 09:32:30 target. Instead fire every hour, every day:
    # runs outside a mode's guard window (weekends, nights, afternoons) exit
    # in seconds, and the first run landing in the 5h30m before a target
    # sleeps on the runner until it. Whatever the delay, hourly arrivals put
    # several runs inside that window. UTC-only cron is fine: scan.py works
    # in ET, so there are no DST-specific entries any more.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "RUN_MODE (only the matching job runs on manual dispatch)"
        type: choice
        # all = both jobs, used by the relay job's self-dispatch.
        options: [fast, range, all]
        default: fast
      force:
        description: "Bypass the guard and sleep-to-target"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write   # relay job dispatches this workflow

jobs:
  scan-fast:
    # On manual dispatch, only run the job matching the chosen mode.
    # Scheduled runs always attempt both jobs; should_run()'s per-mode
    # idempotency check is what keeps that safe and cheap.
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'fast' || inputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # max for hosted runners; covers the 5h30m sleep

    concurrency:
      group: gap-scan-fast
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan (fast)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          RUN_MODE: fast
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
          MIN_GAP: "0.05"
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name  "gap-scanner[bot]"
          git config user.email "gap-scanner@users.noreply.github.com"
          git add data/ universe.json
          if git diff --staged --quiet; then
            echo "No changes to commit (guard exit or identical output)."
          else
            git commit -m "scan(fast): $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

  scan-range:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'range' || inputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # max for hosted runners; covers the 5h30m sleep

    concurrency:
      group: gap-scan-range
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan (range)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          RUN_MODE: range
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
          MIN_GAP: "0.05"
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name  "gap-scanner[bot]"
          git config user.email "gap-scanner@users.noreply.github.com"
          # data/ only -- range mode is read-only on universe.json (fast
          # mode is its single writer), so it must never stage it.
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit (guard exit or identical output)."
          else
            git commit -m "scan(range): $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

  relay:
    # Scheduled arrivals are 3-6.3h apart, so the one before the arm window
    # can be followed by nothing until after the target (9/24, 9/25). A run
    # landing up to 11h20m before 04:40 ET sleeps (one hop, or a full hop
    # then again from the dispatched run) and dispatches mode=all,
    # force=false, which starts in <60s and arms both jobs. GITHUB_TOKEN may
    # trigger workflow_dispatch (unlike push etc.). The concurrency group
    # keeps one relay sleeping; newer scheduled relays wait behind it and
    # exit once it has fired.
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # covers the 5h40m hop

    concurrency:
      group: gap-scan-relay
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sleep until the relay arrival
        id: relay
        env:
          RUN_MODE: relay
        run: python scan.py

      - name: Dispatch a fresh run
        if: steps.relay.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=all -f force=false
